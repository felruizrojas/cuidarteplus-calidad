# SonarQube local (Actividad 2): análisis estático de backend y frontend.
# Se enciende con:  ./sonar.sh up
services:
  sonarqube:
    image: sonarqube:community
    container_name: cuidarteplus-sonarqube
    ports:
      - "${PORT_SONARQUBE:-9000}:9000"
    environment:
      SONAR_ES_BOOTSTRAP_CHECKS_DISABLE: "true"
      # Límites de memoria para equipos con poca RAM asignada a Docker
      SONAR_WEB_JAVAOPTS: "-Xmx512m -Xms128m"
      SONAR_CE_JAVAOPTS: "-Xmx768m -Xms128m"
      SONAR_SEARCH_JAVAOPTS: "-Xmx512m -Xms512m"
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_extensions:/opt/sonarqube/extensions
    networks:
      - sonar-net

volumes:
  sonarqube_data:
  sonarqube_extensions:

networks:
  sonar-net:
    name: cuidarteplus-sonar-net
