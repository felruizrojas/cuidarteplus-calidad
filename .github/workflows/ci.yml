# =====================================================================
#  Pipeline de calidad de Cuidarte+ (Integración y Entrega Continua)
#  Se ejecuta solo cada vez que alguien sube cambios o abre un Pull Request.
#  Orden "fallar rápido": primero lo barato y rápido, al final lo lento.
# =====================================================================
name: Calidad Cuidarte+

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch: # permite ejecutarlo a mano desde la pestaña Actions

permissions:
  contents: read

# Puertos fijos para que local y pipeline usen las mismas direcciones
env:
  PORT_POSTGRES: 15443
  PORT_BACKEND: 4445
  PORT_FRONTEND: 3334

jobs:
  # -------------------------------------------------------------------
  # ETAPA 1 · Revisiones rápidas (se ejecutan en paralelo)
  # -------------------------------------------------------------------
  secretos:
    name: 1a · Secretos (Gitleaks)
    runs-on: ubuntu-24.04 # versión fija: Playwright 1.56 aún no soporta Ubuntu 26.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0 # revisa TODO el historial, no solo el último cambio
      - name: Descargar Gitleaks
        run: |
          curl -sSL --proto '=https' --tlsv1.2 https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz | tar xz gitleaks
      - name: Buscar contraseñas y claves expuestas en el historial
        run: ./gitleaks git . --redact -v

  dockerfiles:
    name: 1b · Dockerfiles (Hadolint)
    runs-on: ubuntu-24.04 # versión fija: Playwright 1.56 aún no soporta Ubuntu 26.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Revisar Dockerfile del backend
        uses: hadolint/hadolint-action@54c9adbab1582c2ef04b2016b760714a4bfde3cf # v3.1.0
        with:
          dockerfile: BACKEND/Dockerfile
      - name: Revisar Dockerfile del frontend
        uses: hadolint/hadolint-action@54c9adbab1582c2ef04b2016b760714a4bfde3cf # v3.1.0
        with:
          dockerfile: FRONTEND/Dockerfile

  # -------------------------------------------------------------------
  # ETAPA 2 · Pruebas unitarias, de integración y análisis de código
  # -------------------------------------------------------------------
  pruebas-codigo:
    name: 2 · Unitarias + Integración (Jest) y SonarQube
    needs: [secretos, dockerfiles]
    runs-on: ubuntu-24.04 # versión fija: Playwright 1.56 aún no soporta Ubuntu 26.04
    env:
      # Si el secreto aún no existe, el análisis de SonarQube Cloud se omite
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0 # SonarQube necesita el historial completo

      - name: Encender la base de datos de pruebas
        run: docker compose up -d --wait cuidarteplus-postgres-et

      - name: Esperar a que la base de datos termine de cargar los datos iniciales
        run: |
          for _ in $(seq 1 30); do
            docker exec cuidarteplus-postgres-et psql -U postgres -d cuidarteplus -tAc "SELECT 1 FROM usuarios LIMIT 1" 2>/dev/null | grep -q 1 && exit 0
            sleep 2
          done
          docker compose logs cuidarteplus-postgres-et && exit 1

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: BACKEND/package-lock.json

      - name: Instalar dependencias del backend
        working-directory: BACKEND
        run: npm ci --ignore-scripts

      - name: Ejecutar pruebas unitarias e integración con cobertura
        working-directory: BACKEND
        run: npm test -- --runInBand --silent

      - name: Guardar reporte de cobertura
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cobertura-backend
          path: BACKEND/coverage/

      - name: Ajustar rutas de cobertura para SonarQube Cloud
        run: sed -i 's#^SF:#SF:BACKEND/#' BACKEND/coverage/lcov.info

      - name: Análisis SonarQube Cloud y Quality Gate
        if: env.SONAR_TOKEN != ''
        uses: SonarSource/sonarqube-scan-action@59202af334b4ba7b5db01b701b8e79f8b3bef0f4 # v8.5.0
        with:
          args: >
            -Dsonar.qualitygate.wait=true

  # -------------------------------------------------------------------
  # ETAPA 3 · Pruebas del sistema completo funcionando
  # -------------------------------------------------------------------
  pruebas-sistema:
    name: 3 · Sistema, aceptación, rendimiento y seguridad
    needs: [pruebas-codigo]
    runs-on: ubuntu-24.04 # versión fija: Playwright 1.56 aún no soporta Ubuntu 26.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Generar un JWT_SECRET propio de esta ejecución
        run: echo "JWT_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"

      - name: Construir y encender Cuidarte+ completo con Docker
        run: docker compose up -d --build --wait || docker compose up -d --wait

      - name: Esperar a que la API y el frontend respondan
        run: |
          for _ in $(seq 1 30); do
            curl -sf -X POST http://localhost:4445/autenticacion/login \
              -H "Content-Type: application/json" \
              -d '{"nombre_usuario":"admin","password":"admin"}' > /dev/null \
            && curl -sf http://localhost:3334 > /dev/null && exit 0
            sleep 2
          done
          docker compose logs && echo "Cuidarte+ no respondió a tiempo" && exit 1

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: pruebas-e2e/package-lock.json

      # --- Sistema + aceptación + accesibilidad (Playwright + axe-core) ---
      - name: Instalar Playwright
        working-directory: pruebas-e2e
        run: |
          npm ci --ignore-scripts
          ./node_modules/.bin/playwright install --with-deps chromium

      - name: Pruebas de sistema, aceptación y accesibilidad
        working-directory: pruebas-e2e
        run: ./node_modules/.bin/playwright test

      - name: Guardar reporte de Playwright
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: reporte-playwright
          path: pruebas-e2e/playwright-report/

      # --- Rendimiento (k6) ---
      - name: Prueba de rendimiento (perfil humo, NFR-PERF-1)
        run: |
          mkdir -p k6-resultados && sudo chown 12345:12345 k6-resultados # usuario k6 del contenedor
          docker run --rm --network host \
            -v "$PWD/pruebas-rendimiento:/scripts" -v "$PWD/k6-resultados:/resultados" \
            grafana/k6:1.3.0 run -e PERFIL=humo \
            --summary-export=/resultados/resumen-humo.json /scripts/carga.js

      - name: Guardar resumen de k6
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: resultados-k6
          path: k6-resultados/

      # --- Seguridad dinámica (OWASP ZAP) ---
      - name: Escaneo de seguridad ZAP (web y API)
        if: always()
        run: |
          mkdir -p zap && sudo chown 1000:1000 zap # usuario zap del contenedor
          docker run --rm --network host -v "$PWD/zap:/zap/wrk:rw" \
            ghcr.io/zaproxy/zaproxy:stable \
            zap-baseline.py -t http://localhost:3334 -r zap-web.html -J zap-web.json -I
          docker run --rm --network host -v "$PWD/zap:/zap/wrk:rw" \
            ghcr.io/zaproxy/zaproxy:stable \
            zap-api-scan.py -t http://localhost:4445/openapi.json -f openapi -r zap-api.html -J zap-api.json -I

      - name: Guardar reportes de ZAP
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: reportes-zap
          path: zap/

      - name: Apagar Cuidarte+
        if: always()
        run: docker compose down -v

  # -------------------------------------------------------------------
  # ETAPA 4 · Entrega continua: publicar las imágenes aprobadas
  # Solo ocurre en la rama main y solo si TODO lo anterior salió bien.
  # -------------------------------------------------------------------
  publicar:
    name: 4 · Publicar imágenes Docker (GHCR)
    needs: [pruebas-sistema]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04 # versión fija: Playwright 1.56 aún no soporta Ubuntu 26.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Preparar nombre del dueño en minúsculas
        run: echo "OWNER=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"

      - name: Iniciar sesión en GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Construir y publicar imagen del backend
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ./BACKEND
          push: true
          tags: |
            ghcr.io/${{ env.OWNER }}/cuidarteplus-backend:latest
            ghcr.io/${{ env.OWNER }}/cuidarteplus-backend:${{ github.sha }}

      - name: Construir y publicar imagen del frontend
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ./FRONTEND
          push: true
          build-args: |
            VITE_API_URL=http://localhost:4445
          tags: |
            ghcr.io/${{ env.OWNER }}/cuidarteplus-frontend:latest
            ghcr.io/${{ env.OWNER }}/cuidarteplus-frontend:${{ github.sha }}
