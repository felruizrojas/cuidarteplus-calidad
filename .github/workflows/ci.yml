# =====================================================================
#  Pipeline de calidad de Cuidarte+ (Integración y Entrega Continua)
#  Se ejecuta solo cada vez que alguien sube cambios o abre un Pull Request.
#  Orden "fallar rápido": primero lo barato y rápido, al final lo lento.
# =====================================================================
name: Calidad Cuidarte+

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch: # permite ejecutarlo a mano desde la pestaña Actions

permissions:
  contents: read

# Puertos fijos para que local y pipeline usen las mismas direcciones
env:
  PORT_POSTGRES: 15443
  PORT_BACKEND: 4445
  PORT_FRONTEND: 3334

jobs:
  # -------------------------------------------------------------------
  # ETAPA 1 · Revisiones rápidas (se ejecutan en paralelo)
  # -------------------------------------------------------------------
  secretos:
    name: 1a · Secretos (Gitleaks)
    runs-on: ubuntu-24.04 # versión fija: Playwright 1.56 aún no soporta Ubuntu 26.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0 # revisa TODO el historial, no solo el último cambio

      - name: Partir sin los reportes versionados (se regeneran en esta ejecución)
        run: rm -rf reportes
      - name: Descargar Gitleaks
        run: |
          curl -sSL --proto '=https' --tlsv1.2 https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz | tar xz gitleaks
      - name: Buscar contraseñas y claves expuestas en el historial
        run: ./gitleaks git . --redact -v --report-format json --report-path gitleaks.json

      - name: Generar reporte HTML de Gitleaks
        if: always()
        run: mkdir -p reportes/gitleaks && cp gitleaks.json reportes/gitleaks/ && python3 scripts/reportes/generar_html.py gitleaks

      - name: Guardar reporte de Gitleaks
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: reportes-gitleaks
          path: reportes/

  dockerfiles:
    name: 1b · Dockerfiles (Hadolint)
    runs-on: ubuntu-24.04 # versión fija: Playwright 1.56 aún no soporta Ubuntu 26.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Partir sin los reportes versionados (se regeneran en esta ejecución)
        run: rm -rf reportes
      - name: Revisar los Dockerfiles con Hadolint (falla ante cualquier advertencia)
        run: |
          mkdir -p reportes/hadolint
          rc=0
          for d in BACKEND FRONTEND; do
            docker run --rm -i hadolint/hadolint:v2.12.0 hadolint --format json - < "$d/Dockerfile" > "reportes/hadolint/$d.json" || rc=1
            echo "== $d/Dockerfile" && cat "reportes/hadolint/$d.json" && echo
          done
          python3 scripts/reportes/generar_html.py hadolint
          exit $rc

      - name: Guardar reporte de Hadolint
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: reportes-hadolint
          path: reportes/

  # -------------------------------------------------------------------
  # ETAPA 2 · Pruebas unitarias, de integración y análisis de código
  # -------------------------------------------------------------------
  pruebas-codigo:
    name: 2 · Unitarias + Integración (Jest) y SonarQube
    needs: [secretos, dockerfiles]
    runs-on: ubuntu-24.04 # versión fija: Playwright 1.56 aún no soporta Ubuntu 26.04
    env:
      # Si el secreto aún no existe, el análisis de SonarQube Cloud se omite
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0 # SonarQube necesita el historial completo

      - name: Partir sin los reportes versionados (se regeneran en esta ejecución)
        run: rm -rf reportes

      - name: Encender la base de datos de pruebas
        run: docker compose up -d --wait cuidarteplus-postgres-et

      - name: Esperar a que la base de datos termine de cargar los datos iniciales
        run: |
          for _ in $(seq 1 30); do
            docker exec cuidarteplus-postgres-et psql -U postgres -d cuidarteplus -tAc "SELECT 1 FROM usuarios LIMIT 1" 2>/dev/null | grep -q 1 && exit 0
            sleep 2
          done
          docker compose logs cuidarteplus-postgres-et && exit 1

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: BACKEND/package-lock.json

      - name: Instalar dependencias del backend
        working-directory: BACKEND
        run: npm ci --ignore-scripts

      - name: Ejecutar pruebas unitarias, de integración y de seguridad de la API (Jest + Supertest)
        working-directory: BACKEND
        run: npm test -- --runInBand --silent --json --outputFile=../reportes/jest/resultados.json

      - name: Guardar reporte HTML de Jest y de cobertura
        if: always()
        run: mkdir -p reportes/jest && rm -rf reportes/jest/cobertura && cp -R BACKEND/coverage/lcov-report reportes/jest/cobertura

      - name: Subir reportes de Jest
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: reportes-jest
          path: reportes/

      - name: Ajustar rutas de cobertura para SonarQube Cloud
        run: sed -i 's#^SF:#SF:BACKEND/#' BACKEND/coverage/lcov.info

      - name: Análisis SonarQube Cloud y Quality Gate
        if: env.SONAR_TOKEN != ''
        uses: SonarSource/sonarqube-scan-action@2f77a1ec69fb1d595b06f35ab27e97605bdef703 # v5
        with:
          args: >
            -Dsonar.qualitygate.wait=true

  # -------------------------------------------------------------------
  # ETAPA 3 · Pruebas del sistema completo funcionando
  # -------------------------------------------------------------------
  pruebas-sistema:
    name: 3 · Sistema, aceptación, rendimiento y seguridad
    needs: [pruebas-codigo]
    runs-on: ubuntu-24.04 # versión fija: Playwright 1.56 aún no soporta Ubuntu 26.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Partir sin los reportes versionados (se regeneran en esta ejecución)
        run: rm -rf reportes

      - name: Generar un JWT_SECRET propio de esta ejecución
        run: echo "JWT_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"

      - name: Construir y encender Cuidarte+ completo con Docker
        run: docker compose up -d --build --wait || docker compose up -d --wait

      - name: Esperar a que la API y el frontend respondan
        run: |
          for _ in $(seq 1 30); do
            curl -sf -X POST http://localhost:4445/autenticacion/login \
              -H "Content-Type: application/json" \
              -d '{"nombre_usuario":"admin","password":"admin"}' > /dev/null \
            && curl -sf http://localhost:3334 > /dev/null && exit 0
            sleep 2
          done
          docker compose logs && echo "Cuidarte+ no respondió a tiempo" && exit 1

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: pruebas-e2e/package-lock.json

      # --- Seguridad dinámica (OWASP ZAP): va primero, CP-10 lee su resultado ---
      - name: Escaneo de seguridad ZAP (web y API)
        run: |
          mkdir -p reportes/zap && sudo chown 1000:1000 reportes/zap # usuario zap del contenedor
          docker run --rm --network host -v "$PWD/reportes/zap:/zap/wrk:rw" ghcr.io/zaproxy/zaproxy:stable \
            zap-baseline.py -t http://localhost:3334 -r zap-web.html -J zap-web.json -I
          docker run --rm --network host -v "$PWD/reportes/zap:/zap/wrk:rw" ghcr.io/zaproxy/zaproxy:stable \
            zap-api-scan.py -t http://localhost:4445/openapi.json -f openapi -r zap-api.html -J zap-api.json -I

      # --- Sistema, aceptación, seguridad, usabilidad y resiliencia (Playwright + axe-core) ---
      - name: Instalar Playwright y los navegadores (Chromium, Firefox, WebKit y Edge)
        working-directory: pruebas-e2e
        run: |
          npm ci --ignore-scripts
          ./node_modules/.bin/playwright install --with-deps chromium firefox webkit msedge

      - name: Pruebas de sistema, aceptación, seguridad, usabilidad y resiliencia
        working-directory: pruebas-e2e
        run: ./node_modules/.bin/playwright test

      # --- Rendimiento (k6): CP-06, operaciones CRUD con carga normal ---
      - name: Prueba de rendimiento CP-06 (NFR-PERF-1)
        run: |
          mkdir -p reportes/k6 && sudo chown 12345:12345 reportes/k6 # usuario k6 del contenedor
          docker run --rm --network host -e K6_WEB_DASHBOARD=true -e K6_WEB_DASHBOARD_EXPORT=/resultados/cp06-crud.html \
            -v "$PWD/pruebas-rendimiento:/scripts" -v "$PWD/reportes/k6:/resultados" \
            grafana/k6:1.3.0 run --quiet /scripts/cp06-crud.js

      - name: Guardar reportes de ZAP, Playwright y k6
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: reportes-sistema
          path: reportes/

      - name: Apagar Cuidarte+
        if: always()
        run: docker compose down -v

  # -------------------------------------------------------------------
  # ETAPA 4 · Entrega continua: publicar las imágenes aprobadas
  # Solo ocurre en la rama main y solo si TODO lo anterior salió bien.
  # -------------------------------------------------------------------
  publicar:
    name: 4 · Publicar imágenes Docker (GHCR)
    needs: [pruebas-sistema]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04 # versión fija: Playwright 1.56 aún no soporta Ubuntu 26.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Preparar nombre del dueño en minúsculas
        run: echo "OWNER=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"

      - name: Iniciar sesión en GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Construir y publicar imagen del backend
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ./BACKEND
          push: true
          tags: |
            ghcr.io/${{ env.OWNER }}/cuidarteplus-backend:latest
            ghcr.io/${{ env.OWNER }}/cuidarteplus-backend:${{ github.sha }}

      - name: Construir y publicar imagen del frontend
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ./FRONTEND
          push: true
          build-args: |
            VITE_API_URL=http://localhost:4445
          tags: |
            ghcr.io/${{ env.OWNER }}/cuidarteplus-frontend:latest
            ghcr.io/${{ env.OWNER }}/cuidarteplus-frontend:${{ github.sha }}

  # -------------------------------------------------------------------
  # ETAPA 5 · Reunir los reportes HTML de todas las herramientas
  # -------------------------------------------------------------------
  reportes:
    name: 5 · Reportes HTML
    needs: [secretos, dockerfiles, pruebas-codigo, pruebas-sistema]
    if: always()
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: read # para leer las alertas de CodeQL
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Descargar los reportes de cada etapa
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: reportes-*
          path: reportes-nuevos
          merge-multiple: true

      - name: Generar reportes de SonarQube Cloud y CodeQL, e índice
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          rm -rf reportes && mv reportes-nuevos reportes
          python3 scripts/reportes/generar_html.py sonarqube cloud || true
          python3 scripts/reportes/generar_html.py codeql || true
          python3 scripts/reportes/generar_html.py indice

      - name: Publicar todos los reportes HTML como un solo artefacto
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: reportes-html
          path: reportes/
