# Configuración para SonarQube Cloud (la usa el pipeline de GitHub Actions)
sonar.organization=felruizrojas
sonar.projectKey=felruizrojas_cuidarteplus-calidad
sonar.projectName=Cuidarte+

sonar.sources=BACKEND/src,FRONTEND/src
sonar.tests=BACKEND/tests,pruebas-e2e/tests
sonar.exclusions=**/node_modules/**,FRONTEND/src/assets/**,reportes/**,**/*.html

# Cobertura de las pruebas del backend (Jest)
sonar.javascript.lcov.reportPaths=BACKEND/coverage/lcov.info
# El frontend se prueba con Playwright (no genera cobertura de código)
sonar.coverage.exclusions=FRONTEND/src/**,BACKEND/tests/**,pruebas-e2e/**,pruebas-rendimiento/**,scripts/**,*.sh
# Las pruebas y los scripts de apoyo no requieren cobertura propia, pero sí se analizan sus hallazgos de seguridad

sonar.sourceEncoding=UTF-8
